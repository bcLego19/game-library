<!-- pong index page -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong</title>
    <link rel="stylesheet" href="/src/styles/global.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header-link-container">
        <a href="../../" class="back-link">
            &larr; Back to Game Library
        </a>
        <button id="theme-toggle-btn">🌞 Light Mode</button>
    </div>

    <div class="game-container">
        <h1>Pong</h1>
        <canvas id="pong-board"></canvas>
        <div class="score-container">
            <div id="player-score">Player: 0</div>
            <div id="computer-score">Computer: 0</div>
        </div>
        <button id="restart-btn" class="restart-btn">Restart Game</button>
    </div>
    
    <script src="../../scripts/theme-toggle.js"></script>
    <script src="script.js"></script>
</body>
</html>
