<!-- pong index page -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Library | Pong</title>
    <link rel="stylesheet" href="/game-library/styles/global.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header-link-container">
        <a href="../../" class="back-link">
            &larr; Back to Game Library
        </a>
        <button id="theme-toggle-btn">🌞 Light Mode</button>
    </div>

    <div class="game-container">
        <!-- Scoreboard -->
        <div class="score-container">
            <div id="player-score">Player: 0</div>
            <div id="computer-score">Computer: 0</div>
        </div>

        <!-- Canvas -->
        <canvas id="pong-board"></canvas>

        <!-- Controls -->
        <div class="controls-container">
            <button id="restart-btn">Restart Game</button>

            <div class="dpad-container">
                <button id="up-btn" class="game-btn">UP</button>
                <button id="bottom-btn" class="game-btn">DOWN</button>
            </div>
        </div>
    </div>
    
    <script src="../../scripts/theme-toggle.js" type="module"></script>
    <script src="script.js"></script>
</body>
</html>
